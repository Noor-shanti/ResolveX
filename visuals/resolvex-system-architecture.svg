<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">ResolveX | System Architecture &amp; Workflow</title>
  <desc id="desc">A simplified system flow for ResolveX: an employee submits a ticket through the app; an IT Support Engineer requests AI analysis; a framed Technical Support Agent classifies the issue, retrieves Ask Ubuntu and official Ubuntu documentation, checks evidence, and conditionally drafts a grounded Gemini and LangChain response. The engineer reviews, chats internally, and resolves or escalates; the employee tracks status.</desc>
  <defs>
    <filter id="shadow" x="-15%" y="-15%" width="135%" height="145%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#020617" flood-opacity=".25"/></filter>
    <marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#78A9FF"/></marker>
    <marker id="teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#55D6C2"/></marker>
    <marker id="amber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#FFC978"/></marker>
    <style>
      text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
      .title{font-size:38px;font-weight:760;letter-spacing:-.7px;fill:#F4F7FC}
      .subtitle{font-size:17px;font-weight:450;fill:#AAB8CC}
      .cardtitle{font-size:19px;font-weight:750;letter-spacing:.5px}
      .body{font-size:16px;font-weight:530;fill:#E5EDF8}
      .small{font-size:14px;font-weight:550;fill:#B5C2D3}
      .label{font-size:13px;font-weight:650;fill:#D8E2F0}
      .agentlabel{font-size:16px;font-weight:680;fill:#ECF2FC}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#0B1220"/>
  <circle cx="1460" cy="50" r="250" fill="#172743" opacity=".28"/>
  <text x="64" y="74" class="title">ResolveX | System Architecture &amp; Workflow</text>
  <text x="66" y="108" class="subtitle">AI concepts applied in an engineer-reviewed Ubuntu/Linux support prototype</text>
  <line x1="64" y1="135" x2="1536" y2="135" stroke="#263449"/>

  <g filter="url(#shadow)"><rect x="50" y="330" width="220" height="180" rx="22" fill="#152742" stroke="#5D8FE6" stroke-width="2"/></g>
  <circle cx="83" cy="368" r="6" fill="#78A9FF"/>
  <text x="102" y="375" class="cardtitle" fill="#BBD2FF">EMPLOYEE</text>
  <text x="80" y="422" class="body">Submits a ticket</text>
  <text x="80" y="452" class="small">Tracks status privately</text>

  <g filter="url(#shadow)"><rect x="345" y="300" width="280" height="240" rx="22" fill="#102B2D" stroke="#3CB9A7" stroke-width="2"/></g>
  <circle cx="380" cy="338" r="6" fill="#55D6C2"/>
  <text x="399" y="345" class="cardtitle" fill="#9CEBDD">RESOLVEX APP</text>
  <text x="378" y="394" class="body">Streamlit · FastAPI</text>
  <text x="378" y="422" class="body">SQLite</text>
  <line x1="378" y1="443" x2="591" y2="443" stroke="#285052"/>
  <text x="378" y="473" class="small">Ticket intake &amp; support inbox</text>
  <text x="378" y="498" class="small">Analysis, chat &amp; status</text>

  <rect x="690" y="205" width="470" height="430" rx="27" fill="#111D31" fill-opacity=".9" stroke="#6F91C4" stroke-width="2.5"/>
  <circle cx="725" cy="240" r="6" fill="#8FB5FF"/>
  <text x="745" y="247" class="cardtitle" fill="#C5D8FA">TECHNICAL SUPPORT AGENT</text>
  <text x="730" y="290" class="agentlabel">Classify ticket</text>
  <text x="730" y="313" class="small">TF-IDF + Logistic Regression</text>
  <line x1="730" y1="332" x2="1120" y2="332" stroke="#2B3C54"/>
  <text x="730" y="365" class="agentlabel">Retrieve relevant knowledge · RAG</text>
  <rect x="730" y="382" width="160" height="31" rx="15" fill="#2A2145" stroke="#9274D0"/>
  <text x="747" y="403" class="small" fill="#D9C9FF">Ask Ubuntu</text>
  <rect x="900" y="382" width="220" height="31" rx="15" fill="#2A2145" stroke="#9274D0"/>
  <text x="916" y="403" class="small" fill="#D9C9FF">Official Ubuntu Docs</text>
  <line x1="730" y1="432" x2="1120" y2="432" stroke="#2B3C54"/>
  <text x="730" y="466" class="agentlabel">Check evidence &amp; safety</text>
  <text x="730" y="494" class="small">When supported:</text>
  <rect x="730" y="511" width="210" height="36" rx="18" fill="#173557" stroke="#5D8FE6"/>
  <text x="750" y="535" class="small" fill="#C6DCFF">Gemini + LangChain</text>
  <text x="956" y="534" class="small">Otherwise → review</text>
  <text x="730" y="590" class="small">Grounded response · citations · review signals</text>

  <g filter="url(#shadow)"><rect x="1260" y="305" width="290" height="230" rx="22" fill="#302515" stroke="#D49A3C" stroke-width="2"/></g>
  <circle cx="1295" cy="343" r="6" fill="#FFC978"/>
  <text x="1314" y="350" class="cardtitle" fill="#FFD99E">IT SUPPORT ENGINEER</text>
  <text x="1292" y="395" class="body">Reviews analysis</text>
  <text x="1292" y="423" class="small">Internal, ticket-scoped chat</text>
  <line x1="1292" y1="442" x2="1518" y2="442" stroke="#5C4829"/>
  <text x="1292" y="474" class="small">Final decision</text>
  <text x="1292" y="503" class="body">Resolve · Escalate</text>

  <path d="M270 420H345" fill="none" stroke="#78A9FF" stroke-width="3" marker-end="url(#blue)"/>
  <rect x="277" y="387" width="62" height="24" rx="12" fill="#0B1220"/><text x="287" y="404" class="label">Submit</text>

  <path d="M485 300V174H1405V305" fill="none" stroke="#55D6C2" stroke-width="2.5" marker-end="url(#teal)"/>
  <rect x="805" y="158" width="250" height="25" rx="12" fill="#0B1220"/><text x="819" y="176" class="label">Ticket enters support inbox</text>

  <path d="M1260 390H1160" fill="none" stroke="#FFC978" stroke-width="2.5" marker-end="url(#amber)"/>
  <rect x="1165" y="356" width="94" height="24" rx="12" fill="#0B1220"/><text x="1173" y="373" class="label">Requests analysis</text>
  <path d="M1160 465H1260" fill="none" stroke="#78A9FF" stroke-width="2.5" marker-end="url(#blue)"/>
  <rect x="1167" y="474" width="90" height="40" rx="9" fill="#0B1220"/>
  <text x="1174" y="490" class="label">Result or</text><text x="1174" y="507" class="label">review signal</text>

  <path d="M1405 535V720H485V540" fill="none" stroke="#FFC978" stroke-width="2.5" marker-end="url(#amber)"/>
  <rect x="832" y="701" width="226" height="27" rx="13" fill="#0B1220"/><text x="849" y="719" class="label">Engineer updates ticket status</text>
  <path d="M345 460H300V790H160V510" fill="none" stroke="#55D6C2" stroke-width="2.5" marker-end="url(#teal)"/>
  <rect x="170" y="770" width="205" height="27" rx="13" fill="#0B1220"/><text x="184" y="788" class="label">Employee tracks status</text>

  <rect x="720" y="816" width="410" height="40" rx="20" fill="#171D31" stroke="#6856A1"/>
  <text x="822" y="842" class="small" fill="#D1C3F5">Langfuse · tracing &amp; evaluation</text>
</svg>
